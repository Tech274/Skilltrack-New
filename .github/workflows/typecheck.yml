name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (eslint)
        # eslint-plugin-prettier reports formatting in this step. Style
        # failures stay visible in the log, but must not skip or fail the
        # typecheck, unit test, and build gates below.
        continue-on-error: true
        run: bun run lint

      - name: Typecheck (tsc --noEmit)
        # Catches JSX closing-tag mismatches (TS17002), unbalanced fragments,
        # and any other structural TS errors before merge.
        run: bunx tsc --noEmit

      - name: Unit tests (vitest)
        # Runs vitest in non-watch mode. Test files use the *.test.ts(x) suffix.
        run: bunx vitest run

      - name: Build
        # Full production build — catches Vite/SSR-time errors that tsc cannot.
        run: bun run build
